name = "tuopinion-almuerzo"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
# El Worker corre primero solo para la API; el resto es la pagina estatica.
run_worker_first = ["/api/*"]

# Secretos (NO van en este archivo ni en GitHub). Se cargan con:
#   npx wrangler secret put APPS_SCRIPT_URL      (URL de la implementacion web de Apps Script)
#   npx wrangler secret put SHARED_SECRET        (la misma clave que guardaste en Apps Script)
#   npx wrangler secret put IDENTITY_SECRET      (clave con la que app2 firma el enlace; ver README)

# Topes por usuario y globales ANTES de Drive: Durable Object con almacenamiento SQLite
# (disponible en el plan Workers Free segun la documentacion de Cloudflare).
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# Ademas Apps Script repite los topes diarios como segunda capa (ver Code.gs).
